services:
  dev:
    command: pnpm --filter @kawal/public exec vp dev --host 0.0.0.0 --port "$PORT"
    health: /
    portal:
      title: Kawal Asap development
      description: Native Void public pages with synthetic data. Option B is selected.
  editorial:
    command: pnpm --filter @kawal/editorial exec vp dev --host 0.0.0.0 --port "$PORT"
    health: /healthz
    review: false
    portal:
      title: Kawal Asap editorial foundation
      description: Local Workers runtime with independent D1 and R2. Sign-in is not implemented.
  public:
    command: pnpm --filter @kawal/public build && pnpm public:serve
    health: /
    review: false
    portal:
      title: Kawal Asap static export
      description: Static public files only. No application process or database is required for reads.
