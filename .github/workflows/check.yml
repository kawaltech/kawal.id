name: Check infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    # Do not interrupt a deployment or let two main deployments overlap.
    concurrency:
      group: kawal-public-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.11.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
      - run: |
          .agents/setup
          echo "$HOME/.local/share/kawal-vite-plus/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/kawal-orb-tools/bin" >> "$GITHUB_PATH"
      - run: pnpm check
      - name: Check local D1 and R2, then static reads without the app
        run: |
          export VP_HOME="$HOME/.local/share/kawal-vite-plus"
          export PATH="$VP_HOME/bin:$HOME/.local/share/kawal-orb-tools/bin:$PATH"
          # CI has no orb service manager. Use a process group for full cleanup.
          setsid pnpm --filter @kawal/app exec vp dev --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          app=$!
          trap 'kill -- -"$app" 2>/dev/null || true; cat "$RUNNER_TEMP/app.log"' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 5 http://127.0.0.1:3000/healthz | tee "$RUNNER_TEMP/health.json"
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(JSON.parse(fs.readFileSync(process.argv[1])), {status:'ok'})" "$RUNNER_TEMP/health.json"
          kill -- -"$app"
          wait "$app" || true
          for attempt in {1..10}; do
            if ! curl --silent --max-time 2 http://127.0.0.1:3000/healthz; then stopped=true; break; fi
            sleep 1
          done
          test "${stopped:-false}" = true
          caddy run --config config/Caddyfile --adapter caddyfile > "$RUNNER_TEMP/caddy.log" 2>&1 &
          public=$!
          trap 'kill "$public" 2>/dev/null || true; cat "$RUNNER_TEMP/app.log"; cat "$RUNNER_TEMP/caddy.log"' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:8080/ > /dev/null
          node scripts/check-public.mjs http://127.0.0.1:8080
      - name: Check whether the pushed range needs public deployment
        if: github.repository == 'kawaltech/kawal.id' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          deploy="$(node scripts/check-public-changes.mjs "$PUSH_BEFORE" "$GITHUB_SHA")"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [ "$deploy" = false ]; then
            echo "Documentation-only push: checks passed; skip public deployment."
          fi
      - name: Check that this is still the latest main revision
        if: github.repository == 'kawaltech/kawal.id' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: latest
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin "$latest"
            # Do not lose a pending code deployment when only docs follow it.
            changed="$(node scripts/check-public-changes.mjs "$GITHUB_SHA" "$latest")"
            if [ "$changed" = false ]; then
              echo "Only documentation follows this checked revision."
              echo "current=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skip deployment of a revision superseded by code changes."
            fi
          fi
      - name: Deploy the checked public preview
        if: github.repository == 'kawaltech/kawal.id' && steps.latest.outputs.current == 'true' && steps.changes.outputs.deploy == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: zain
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the repository Actions secret CLOUDFLARE_API_TOKEN before deployment."
            exit 1
          fi
          node scripts/check-public-build.mjs
          export DEPLOY_STARTED_AT="$(date +%s%3N)"
          pnpm --filter @kawal/public exec void deploy --platform cloudflare --skip-build
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs';
          import { homedir } from 'node:os';
          import { join } from 'node:path';
          const dir = join(homedir(), '.void/logs');
          const results = readdirSync(dir)
            .filter(name => name.startsWith('deploy-') && name.endsWith('.jsonl'))
            .flatMap(name => readFileSync(join(dir, name), 'utf8').trim().split('\n').filter(Boolean).map(line => JSON.parse(line)))
            .filter(record => record.ts >= Number(process.env.DEPLOY_STARTED_AT)
              && record.msg === 'cloudflare_deploy_end' && record.ok === true
              && record.worker === 'kawal-asap-design-review');
          assert.equal(results.length, 1, 'Require one success record from this deployment');
          const version = results[0].versionId;
          assert.match(version, /^[0-9a-f-]{36}$/i, 'Require the deployed Worker version ID');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Public Worker version: ${version}`);
          NODE
      - name: Check the deployed version and public files on both hosts
        if: github.repository == 'kawaltech/kawal.id' && steps.latest.outputs.current == 'true' && steps.changes.outputs.deploy == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          test -n "$EXPECTED_VERSION"
          node scripts/check-public.mjs https://kawal-asap-design-review.zain.workers.dev "$EXPECTED_VERSION"
          node scripts/check-public.mjs https://kawal.id "$EXPECTED_VERSION"
