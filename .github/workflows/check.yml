name: Check infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.11.0
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}
      - run: |
          .agents/setup
          echo "$HOME/.local/share/kawal-vite-plus/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/kawal-orb-tools/bin" >> "$GITHUB_PATH"
      - run: pnpm check
      - name: Check local D1 and R2, then static reads without editorial
        run: |
          export VP_HOME="$HOME/.local/share/kawal-vite-plus"
          export PATH="$VP_HOME/bin:$HOME/.local/share/kawal-orb-tools/bin:$PATH"
          # CI has no orb service manager. Use a process group for full cleanup.
          setsid pnpm --filter @kawal/editorial exec vp dev --host 127.0.0.1 --port 3000 > "$RUNNER_TEMP/editorial.log" 2>&1 &
          editorial=$!
          trap 'kill -- -"$editorial" 2>/dev/null || true; cat "$RUNNER_TEMP/editorial.log"' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 --max-time 5 http://127.0.0.1:3000/healthz | tee "$RUNNER_TEMP/health.json"
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(JSON.parse(fs.readFileSync(process.argv[1])), {status:'ok'})" "$RUNNER_TEMP/health.json"
          kill -- -"$editorial"
          wait "$editorial" || true
          for attempt in {1..10}; do
            if ! curl --silent --max-time 2 http://127.0.0.1:3000/healthz; then stopped=true; break; fi
            sleep 1
          done
          test "${stopped:-false}" = true
          caddy run --config config/Caddyfile --adapter caddyfile > "$RUNNER_TEMP/caddy.log" 2>&1 &
          public=$!
          trap 'kill "$public" 2>/dev/null || true; cat "$RUNNER_TEMP/editorial.log"; cat "$RUNNER_TEMP/caddy.log"' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:8080/ > /dev/null
          node scripts/check-public.mjs http://127.0.0.1:8080
