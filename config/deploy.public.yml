# A separate Kamal service keeps public files available during editorial restarts.
service: kawal-asap-public
image: <%= ENV.fetch("KAMAL_IMAGE_PREFIX") %>/kawal-asap-public
servers:
  web:
    - <%= ENV.fetch("KAMAL_HOST") %>
proxy:
  ssl: true
  host: <%= ENV.fetch("PUBLIC_HOST") %>
  app_port: 8080
  healthcheck:
    path: /
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  target: public
env:
  clear:
    PORT: "8080"
    PUBLIC_ROOT: /data/public/current
volumes:
  - /srv/kawal-asap/public:/data/public:ro
